# CONFIG_ARCH_XGENE is not set
# CONFIG_ARCH_ZYNQMP is not set

# The display path (msm, anx7625, TYPEC, i2c-qcom-geni) stays modular:
# building it in hangs the kernel before userspace, with nothing on the
# display and no USB. arduino-dash loads it via modules-load.d instead.

# systemd loads ipv6 itself early in boot when it is a module
CONFIG_IPV6=y

# Smaller symbol table
# CONFIG_KALLSYMS_ALL is not set
