# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

# Recipes that need meta-qt6, parsed only when it is in BBLAYERS (ci/qt.yml)
BBFILES_DYNAMIC += " \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes*/*/*.bb \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-arduino-qcom"
BBFILE_PATTERN_meta-arduino-qcom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-arduino-qcom = "9"

LAYERDEPENDS_meta-arduino-qcom = "core qcom qcom-arduino meta-arduino-common"

LAYERSERIES_COMPAT_meta-arduino-qcom = "scarthgap whinlatter wrynose blacksail"
