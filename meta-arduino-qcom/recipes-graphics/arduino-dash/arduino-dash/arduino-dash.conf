# Display path DPU -> DSI -> ANX7625 -> USB-C DisplayPort, loaded ahead of
# udev's coldplug so the dash can draw its first frame early.
# ANX7625 attaches to DSI before it looks up the USB role switch, and backs
# out again until dwc3 has registered the switch; that unbinds msm, whose
# self-refresh work then oopses. So dwc3 (its Qualcomm glue and both USB
# PHYs) comes up before the bridge.
dispcc-qcm2290
phy-qcom-qusb2
phy-qcom-qmp-usbc
dwc3-qcom-legacy
i2c-qcom-geni
anx7625
msm
