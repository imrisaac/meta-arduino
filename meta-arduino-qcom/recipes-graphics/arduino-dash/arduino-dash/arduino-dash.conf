# Display path DPU -> DSI -> ANX7625 -> USB-C DisplayPort, loaded ahead of
# udev's coldplug so the dash can draw its first frame early.
# ANX7625 attaches to DSI before it looks up the USB role switch, and backs
# out again while dwc3 is still waiting for its PHYs; that unbinds msm, whose
# self-refresh work then oopses. So both USB PHYs load before the bridge.
dispcc-qcm2290
phy-qcom-qusb2
phy-qcom-qmp-usbc
i2c-qcom-geni
anx7625
msm
