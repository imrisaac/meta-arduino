# Display path DPU -> DSI -> ANX7625 -> USB-C DisplayPort and the GPU, loaded
# ahead of udev's coldplug so the cluster can draw its first frame early.
# Without msm.separate_gpu_kms the display and the GPU are a single DRM
# device, which only comes up once the GPU has probed; the GPU clock
# controller goes first so neither the GPU nor its IOMMU has to defer.
# dwc3 comes before the bridge for the USB role switch (see arduino-dash.conf).
gpucc-qcm2290
dispcc-qcm2290
phy-qcom-qusb2
phy-qcom-qmp-usbc
dwc3-qcom-legacy
i2c-qcom-geni
anx7625
msm
