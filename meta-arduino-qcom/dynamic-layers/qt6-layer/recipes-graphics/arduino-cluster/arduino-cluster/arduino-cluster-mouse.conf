# Development: take input from a USB mouse (or keyboard, or touchscreen) on the
# USB-C dock, and draw a pointer while a mouse is connected. Qt then sets up
# libinput and an xkbcommon keymap before the first frame, which adds to the
# boot time: leave arduino-cluster-mouse out of the image to measure it.
[Service]
Environment=QT_QPA_EGLFS_DISABLE_INPUT=0
Environment=QT_QPA_EGLFS_HIDECURSOR=0
